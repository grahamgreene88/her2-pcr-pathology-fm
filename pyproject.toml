[project]
name = "her2-pcr-pathology-fm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Graham Greene", email = "123007914+grahamgreene88@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.16.0",
    "openpyxl>=3.1.5",
    "openslide-bin>=4.0.1.2",
    "openslide-python>=1.4.7",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "timm>=1.0.30",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
her2-pcr-pathology-fm = "her2-pcr-pathology-fm:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbstripout>=0.9.1",
]
